name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: project-d5c04e1d-be23-4954-84c
  GAR_LOCATION: us-central1
  GAR_REPO: oppe2-ml-repo
  GKE_CLUSTER: oppe2-cluster
  GKE_ZONE: us-central1-a
  IMAGE_NAME: heart-disease-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & Train Model
      run: |
        pip install -r requirements.txt
        python src/train.py
        test -f model.pkl || exit 1

    - name: Authenticate to GCP via WIF
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        project_id: ${{ env.PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Authenticate Docker to Artifact Registry
      run: |
        echo '${{ steps.auth.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin https://${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}"
        docker build -t "$IMAGE_TAG:${{ github.sha }}" -t "$IMAGE_TAG:latest" .
        docker push "$IMAGE_TAG:${{ github.sha }}"
        docker push "$IMAGE_TAG:latest"

    - name: Authenticate to GKE
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy Kubernetes Manifests
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/hpa.yaml
        kubectl apply -f k8s/service.yaml
        kubectl set image deployment/heart-disease-api api=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        kubectl rollout status deployment/heart-disease-api --timeout=180s